# requirements.lock — 依赖锁定文件
# 由 pip-compile（pip-tools）从 pyproject.toml 生成，锁定所有直接和间接依赖的精确版本
#
# 生成命令：
#   pip install pip-tools
#   pip-compile pyproject.toml --output-file=requirements.lock --all-extras
#
# 安装命令：
#   pip install -r requirements.lock
#
# 文献: Sandve GK et al. Ten simple rules for reproducible computational research.
#       PLoS Comput Biol 9(10):e1003285, 2013.


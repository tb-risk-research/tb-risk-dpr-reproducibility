   <g id="text_14">
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(681.922372 89.638911)">Repeated-seed descriptive summary</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(669.888544 100.637759)">20 separately fitted five-fold comparisons</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(682.957723 111.636606)">Partitions and simulated orders vary</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(669.640653 122.635454)">Means and seed min/max are descriptive;</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(672.07577 133.634302)">seed ranges are not confidence intervals</text>
   </g>
   <g id="text_15">
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(713.599677 228.642111)">Conditional uncertainty</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(688.554559 239.640959)">2000 paired household resamples</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(690.833817 250.639806)">Resample saved OOF predictions</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(681.508231 261.638654)">Models and order histories stay fixed</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(693.173192 272.637502)">No model or calibration refitting</text>
   </g>
   <g id="text_16">
    <text style="font: 9.3px 'DejaVu Sans'" transform="translate(704.431692 374.57314)">Full-refit raw-RF uncertainty</text>
    <text style="font: 9.3px 'DejaVu Sans'" transform="translate(674.762512 385.340433)">300 household samples; CV seed 0 fixed</text>
    <text style="font: 9.3px 'DejaVu Sans'" transform="translate(670.379161 396.107726)">Unweighted: rebuild priors, preprocessing,</text>
    <text style="font: 9.3px 'DejaVu Sans'" transform="translate(704.786981 406.875019)">CV and both raw RF models</text>
    <text style="font: 9.3px 'DejaVu Sans'" transform="translate(679.376184 417.642312)">IPW: resample 924 source households;</text>
    <text style="font: 9.3px 'DejaVu Sans'" transform="translate(674.243747 428.409605)">also refit observation model and weights</text>
    <text style="font: 9.3px 'DejaVu Sans'" transform="translate(665.574403 439.176898)">Copies of each source household share folds</text>
   </g>
   <g id="text_17">
    <text style="font: 9px 'DejaVu Sans'; text-anchor: middle" x="468" y="521.0856" transform="rotate(-0 468 521.0856)">Schematic of archived procedures; no observed screening chronology, new tuning or final deployment model is implied.</text>
   </g>
  </g>

   <g id="text_9">
    <text style="font: 9.8px 'DejaVu Sans'" transform="translate(390.01405 80.263608)">Within each outer training set:</text>
    <text style="font: 9.8px 'DejaVu Sans'" transform="translate(394.932425 91.609787)">inner four-fold household CV</text>
    <text style="font: 9.8px 'DejaVu Sans'" transform="translate(396.990425 102.955967)">Fold-local fills and RF fitting</text>
   </g>
   <g id="text_10">
    <text style="font: 9.8px 'DejaVu Sans'" transform="translate(402.405691 177.283608)">Fit Platt logistic calibrator</text>
    <text style="font: 9.8px 'DejaVu Sans'" transform="translate(376.151644 188.629787)">on inner OOF score logits and labels</text>
    <text style="font: 9.8px 'DejaVu Sans'" transform="translate(392.279534 199.975967)">C = 10^6; no class balancing</text>
   </g>
   <g id="text_11">
    <text style="font: 9.8px 'DejaVu Sans'" transform="translate(366.281972 269.011608)">Refit RF on all outer training households</text>
    <text style="font: 9.8px 'DejaVu Sans'" transform="translate(405.958956 280.357787)">Apply fixed calibrator to</text>
    <text style="font: 9.8px 'DejaVu Sans'" transform="translate(404.682659 291.703967)">outer held-out RF scores</text>
   </g>
   <g id="text_12">
    <text style="font: 9.7px 'DejaVu Sans'" transform="translate(367.839198 366.14939)">Evaluate pooled outer OOF probabilities</text>
    <text style="font: 9.7px 'DejaVu Sans'" transform="translate(371.140988 377.379793)">Brier / calibration intercept and slope /</text>
    <text style="font: 9.7px 'DejaVu Sans'" transform="translate(383.538042 388.610195)">ECE / exploratory decision curves</text>
    <text style="font: 9.7px 'DejaVu Sans'" transform="translate(414.044542 399.840597)">Summarise 20 seeds</text>
   </g>
   <g id="text_13">
    <text style="font: 700 10px 'DejaVu Sans'" transform="translate(376.300256 463.170206)">Outer-test households enter no</text>
    <text style="font: 700 10px 'DejaVu Sans'" transform="translate(357.356506 474.368019)">preprocessing, model or calibrator fit.</text>
   </g>

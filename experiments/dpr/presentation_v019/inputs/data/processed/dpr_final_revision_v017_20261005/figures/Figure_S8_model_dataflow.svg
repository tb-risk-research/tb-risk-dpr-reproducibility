   <g id="text_1">
    <text style="font: 700 11.2px 'DejaVu Sans'; text-anchor: start" x="19.944" y="29.32545" transform="rotate(-0 19.944 29.32545)">A  Frozen raw-score comparisons</text>
   </g>
   <g id="text_2">
    <text style="font: 700 11.2px 'DejaVu Sans'; text-anchor: start" x="323.352" y="29.32545" transform="rotate(-0 323.352 29.32545)">B  Separate nested calibration</text>
   </g>
   <g id="text_3">
    <text style="font: 700 11.2px 'DejaVu Sans'; text-anchor: start" x="626.76" y="29.32545" transform="rotate(-0 626.76 29.32545)">C  Distinct uncertainty procedures</text>
   </g>
   <g id="text_4">
    <text style="font: 10px 'DejaVu Sans'" transform="translate(43.074613 81.289708)">2725 complete-case contacts / 877 households</text>
    <text style="font: 10px 'DejaVu Sans'" transform="translate(64.414456 92.867442)">20 seeds: outer five-fold household CV</text>
   </g>
   <g id="text_5">
    <text style="font: 10px 'DejaVu Sans'" transform="translate(84.032425 162.642441)">Outer training households only</text>
    <text style="font: 10px 'DejaVu Sans'" transform="translate(66.190238 174.220175)">Estimate fills and fallback prevalence;</text>
    <text style="font: 10px 'DejaVu Sans'" transform="translate(60.451175 185.797909)">EB arms estimate shrinkage parameters</text>
   </g>
   <g id="text_6">
    <text style="font: 9.6px 'DejaVu Sans'" transform="translate(68.94705 251.988262)">Fit RF baseline / four-feature / EB arms</text>
    <text style="font: 9.6px 'DejaVu Sans'" transform="translate(90.82905 263.102887)">Fit standardised LR baseline /</text>
    <text style="font: 9.6px 'DejaVu Sans'" transform="translate(92.5533 274.217512)">four-feature / single-EB arms</text>
    <text style="font: 9.6px 'DejaVu Sans'" transform="translate(87.5388 285.332137)">Frozen settings; no new tuning</text>
   </g>
   <g id="text_7">
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(80.974808 356.210335)">Predict outer held-out households</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(62.104691 367.209182)">Own TST excluded from household priors;</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(85.447972 378.20803)">other results assumed available</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(62.112855 389.206878)">Held-out target labels used for evaluation</text>
   </g>
   <g id="text_8">
    <text style="font: 10px 'DejaVu Sans'" transform="translate(71.13555 466.547308)">Pool outer OOF predictions per seed</text>
    <text style="font: 10px 'DejaVu Sans'" transform="translate(59.374613 478.125042)">Raw AUROC / AUPRC / simulated capture</text>
   </g>
